name: Site

# Builds the site and puts it on GitHub Pages: at every change, and every hour, since the catalog and the players' answers change on their own.
on:
  push:
    branches: [main]
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the catalog and the players' answers
        run: scripts/fetch_data.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
